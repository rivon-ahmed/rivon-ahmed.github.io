<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Boi Campus — বই ক্যাম্পাস</title>
  <meta name="description" content="Buy and sell books near your campus. Download the Boi Campus app."/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#F2F4F0;color:#1C1C0E;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
    .logo{font-size:64px;margin-bottom:16px}
    h1{font-size:28px;font-weight:800;color:#5B7C42;margin-bottom:8px}
    .sub{font-size:16px;color:#6B7280;margin-bottom:32px;line-height:1.5}
    .btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
    .btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 20px;border-radius:14px;text-decoration:none;font-size:15px;font-weight:600;transition:.2s}
    .btn-play{background:#1C1C0E;color:#fff}
    .btn-apple{background:#5B7C42;color:#fff}
    .btn svg{width:22px;height:22px;fill:currentColor}
    .btn:active{opacity:.85;transform:scale(.97)}
    .footer{margin-top:32px;font-size:12px;color:#9CA3AF}
  </style>
</head>

  <div class="logo">📚</div>
